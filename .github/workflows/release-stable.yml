name: Release production
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing production tag version (X.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hypermug-publication
  cancel-in-progress: false
  queue: max
jobs:
  authorize:
    if: github.actor == 'maxmeis' && github.triggering_actor == 'maxmeis'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      - name: Validate tag and source
        id: source
        env:
          TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "${TAG}^{commit}")" = "$(git rev-parse HEAD)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate stable version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
        run: |
          VERSION="${VERSION#v}"
          GITHUB_SHA="$(git rev-parse HEAD)"
          python3 Source/HyperMug/scripts/release_metadata.py validate --channel stable --version "$VERSION" --actor "$GITHUB_ACTOR" --triggering-actor "$GITHUB_TRIGGERING_ACTOR" --ref "refs/tags/v$VERSION" --sha "$GITHUB_SHA" --source-repo "$SOURCE_REPOSITORY" --releases-repo "$RELEASES_REPOSITORY" --tap-repo "$TAP_REPOSITORY"
  release:
    needs: authorize
    runs-on: macos-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      - name: Verify authorized source
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
      - name: Test
        run: |
          python3 -m unittest discover -s Source/HyperMug/scripts -p 'test_release*.py'
          ./Source/HyperMug/scripts/test.sh
          ./Source/HyperMug/scripts/compile-check.sh
      - name: Build and notarize
        env:
          CHANNEL: stable
          VERSION: ${{ inputs.version || github.ref_name }}
          BUILD_NUMBER: ${{ inputs.version || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGN_ID: ${{ vars.SIGN_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          VERSION="${VERSION#v}"
          GITHUB_SHA="$(git rev-parse HEAD)"
          GITHUB_REF="refs/tags/v$VERSION"
          BUILD_NUMBER="$VERSION"
          export VERSION BUILD_NUMBER GITHUB_REF GITHUB_SHA
          ./Source/HyperMug/scripts/release.sh
      - name: Publish stable
        env:
          CHANNEL: stable
          VERSION: ${{ inputs.version || github.ref_name }}
          BUILD_NUMBER: ${{ inputs.version || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_SSH_PRIVATE_KEY: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
        run: |
          VERSION="${VERSION#v}"
          GITHUB_SHA="$(git rev-parse HEAD)"
          GITHUB_REF="refs/tags/v$VERSION"
          BUILD_NUMBER="$VERSION"
          export VERSION BUILD_NUMBER GITHUB_REF GITHUB_SHA
          ./Source/HyperMug/scripts/publish_release.sh
