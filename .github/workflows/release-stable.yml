name: Stable
on:
  workflow_dispatch:
    inputs:
      version:
        description: Production version (X.Y.Z); creates the tag on first run
        required: true
        type: string
      build_app:
        description: Build, sign, notarize and publish the app (false publishes source only)
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hypermug-publication
  cancel-in-progress: false
  queue: max
jobs:
  authorize:
    permissions:
      contents: read
      actions: read
    if: vars.RELEASE_BOT_ENABLED == 'true' && github.actor == 'maxmeis' && github.triggering_actor == 'maxmeis' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      # No production/App secrets in this job. GitHub run metadata identifies
      # the human who started this attempt, including a rerun by another user.
      - name: Authorize owner dispatch and rerun identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = maxmeis/hypermug
          test "$GITHUB_REPOSITORY_ID" = 1455862604
          test "$GITHUB_ACTOR_ID" = 41482988
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/stable-run.json"
          python3 - "$RUNNER_TEMP/stable-run.json" <<'PYRUN'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as source:
              run = json.load(source)
          repo = run.get('repository') or {}
          owner = repo.get('owner') or {}
          head = run.get('head_repository') or {}
          expected_sha = os.environ['GITHUB_SHA']
          if (run.get('id') != int(os.environ['GITHUB_RUN_ID'])
                  or repo.get('id') != 1455862604 or repo.get('full_name') != 'maxmeis/hypermug'
                  or owner.get('id') != 41482988 or head.get('id') != 1455862604
                  or (run.get('actor') or {}).get('id') != 41482988
                  or (run.get('triggering_actor') or {}).get('id') != 41482988
                  or run.get('event') != 'workflow_dispatch'
                  or run.get('path') != '.github/workflows/release-stable.yml'
                  or run.get('head_branch') != 'main'
                  or run.get('head_sha') != expected_sha
                  or run.get('run_attempt') != int(os.environ['GITHUB_RUN_ATTEMPT'])):
              raise SystemExit('Stable requires this repository and the numeric owner identity for this exact attempt')
          PYRUN
      - name: Validate tag and source
        id: source
        env:
          TAG: v${{ inputs.version }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_sha="$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            source_sha="$(git rev-parse "${TAG}^{commit}")"
          fi
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Validate stable version
        env:
          VERSION: ${{ inputs.version }}
          AUTHORIZED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
        run: |
          CHANNEL=stable GITHUB_REF="refs/tags/v$VERSION" GITHUB_SHA="$AUTHORIZED_SHA" make validate-release
  release:
    needs: authorize
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source_sha }}
      - name: Check out trusted current release automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-automation
          persist-credentials: false
      - name: Verify trusted automation commit
        run: test "$(git -C .release-automation rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify authorized source
        env:
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
      - name: Check out shared signing implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: maxmeis/release-bot
          ref: ac8269adb164a9e768bf637169229f9bd0bb4d0e
          path: .release-bot-signing
          persist-credentials: false
      - name: Test
        env:
          RELEASE_BOT_SIGNING_SCRIPT: ${{ github.workspace }}/.release-bot-signing/macos/signing.sh
        run: |
          make test-release
          make check-layers
          make test
          make test-runtime
          make compile-check
          make check-automation
          make check-website
      - name: Test trusted release automation
        env:
          RELEASE_BOT_SIGNING_SCRIPT: ${{ github.workspace }}/.release-bot-signing/macos/signing.sh
        run: make -C .release-automation test-release
      - name: Ensure version tag points to tested source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          AUTHORIZED_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          tag="v$VERSION"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            object="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="HyperMug $VERSION; source $AUTHORIZED_SHA" -f object="$AUTHORIZED_SHA" -f type=commit --jq .sha)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$AUTHORIZED_SHA"
      - name: Build and notarize
        if: inputs.build_app
        env:
          CHANNEL: stable
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGN_ID: ${{ vars.SIGN_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_BOT_SIGNING_SCRIPT: ${{ github.workspace }}/.release-bot-signing/macos/signing.sh
          RELEASE_SOURCE_DIR: ${{ github.workspace }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)"
          GITHUB_REF="refs/tags/v$VERSION"
          BUILD_NUMBER="$VERSION"
          export VERSION BUILD_NUMBER GITHUB_REF GITHUB_SHA
          bash "$RELEASE_BOT_SIGNING_SCRIPT" run -- bash .release-automation/helpers/release.sh
      - name: Mint verified release publisher token
        id: publisher
        uses: maxmeis/release-bot/actions/publisher-token@ac8269adb164a9e768bf637169229f9bd0bb4d0e # pinned release-bot commit
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          expected-app-slug: ${{ vars.RELEASE_BOT_APP_SLUG }}
          expected-installation-id: ${{ vars.RELEASE_BOT_INSTALLATION_ID }}
      - name: Publish stable
        env:
          CHANNEL: stable
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.version }}
          BUILD_APP: ${{ inputs.build_app }}
          PUBLISH_EXTERNAL_TAP: ${{ vars.PUBLISH_EXTERNAL_TAP || 'false' }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
          PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          TAP_SSH_PRIVATE_KEY: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)"
          GITHUB_REF="refs/tags/v$VERSION"
          BUILD_NUMBER="$VERSION"
          export VERSION BUILD_NUMBER GITHUB_REF GITHUB_SHA
          make -C .release-automation publish
