# REVIEW DRAFT ONLY. No GitHub state has been changed for this proposal.
name: Transfer existing Apple signing secrets to AeroSwitch once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    if: >-
      github.repository == 'maxmeis/hypermug' &&
      github.actor == 'maxmeis' &&
      github.triggering_actor == 'maxmeis' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Check existing release-token identity and target access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api user --jq .id)" = '41482988'
          test "$(gh api repos/maxmeis/hypermug --jq .permissions.admin)" = 'true'
          test "$(gh api repos/maxmeis/aeroswitch --jq .owner.id)" = '41482988'
          test "$(gh api repos/maxmeis/aeroswitch --jq .permissions.admin)" = 'true'
          gh api repos/maxmeis/aeroswitch/actions/secrets/public-key --jq .key_id > /dev/null

      - name: Encrypt exactly three existing Apple secrets for AeroSwitch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_PEM: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$CERTIFICATE" &&
            test -n "$CERTIFICATE_PASSWORD" && test -n "$NOTARY_KEY_PEM"
          printf '%s' "$CERTIFICATE" |
            gh secret set DEVELOPER_ID_P12_BASE64 --repo maxmeis/aeroswitch
          printf '%s' "$CERTIFICATE_PASSWORD" |
            gh secret set DEVELOPER_ID_P12_PASSWORD --repo maxmeis/aeroswitch
          printf '%s' "$NOTARY_KEY_PEM" |
            python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64encode(sys.stdin.buffer.read()))' |
            gh secret set NOTARY_API_KEY_BASE64 --repo maxmeis/aeroswitch
          secret_names=$(gh secret list --repo maxmeis/aeroswitch \
            --json name --jq '.[].name')
          for required in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_API_KEY_BASE64; do
            printf '%s\n' "$secret_names" | grep -Fxq "$required"
          done
