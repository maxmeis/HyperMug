name: Website

on:
  push:
    branches: [main]
    paths:
      - 'Source/Website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website assets and JavaScript
        run: |
          node --check Source/Website/script.js
          python3 Source/Automation/check-content.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Source/Website
      - id: deployment
        uses: actions/deploy-pages@v4
