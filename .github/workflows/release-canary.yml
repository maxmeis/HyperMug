name: Canary
on:
  push:
    branches: [main]
    paths:
      - 'Source/HyperMug/**'
      - 'Source/Branding/**'
      - 'helpers/**'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: hypermug-publication
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: vars.RELEASE_BOT_ENABLED == 'true' && github.repository == 'maxmeis/hypermug' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    # The existing beta environment supplies the Canary signing and Sparkle key.
    # Its deployment policy permits only main; beta is an internal secret scope.
    environment: beta
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: package.json
      - name: Validate exact main source
        env:
          VERSION: 0.0.0-canary.${{ github.run_number }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          CHANNEL=canary make validate-release
      - name: Skip a superseded queued run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.0.0-canary.${{ github.run_number }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
        run: |
          gh api "repos/${RELEASES_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          python3 - "$VERSION" "$RUNNER_TEMP/release-tags" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'helpers')
          from release_metadata import canary_superseded
          skip = canary_superseded(sys.argv[1], Path(sys.argv[2]).read_text().splitlines())
          with open(sys.argv[3], 'a') as output:
              output.write(f"skip={str(skip).lower()}\n")
          print('Canary run superseded by a newer release' if skip else 'Canary run is current')
          PY
      - name: Check out shared signing implementation
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: maxmeis/release-bot
          ref: ac8269adb164a9e768bf637169229f9bd0bb4d0e
          path: .release-bot-signing
          persist-credentials: false
      - name: Test
        env:
          RELEASE_BOT_SIGNING_SCRIPT: ${{ github.workspace }}/.release-bot-signing/macos/signing.sh
        if: steps.freshness.outputs.skip != 'true'
        run: |
          make test-release
          make check-layers
          make test
          make test-runtime
          make compile-check
          make check-automation
          make check-website
      - name: Ensure unique Canary tag points to tested source
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.0.0-canary.${{ github.run_number }}
        run: |
          tag="v$VERSION"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            object="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="HyperMug Canary $VERSION; source $GITHUB_SHA" -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
      - name: Build and notarize
        if: steps.freshness.outputs.skip != 'true'
        env:
          CHANNEL: canary
          VERSION: 0.0.0-canary.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGN_ID: ${{ vars.SIGN_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_BOT_SIGNING_SCRIPT: ${{ github.workspace }}/.release-bot-signing/macos/signing.sh
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: bash "$RELEASE_BOT_SIGNING_SCRIPT" run -- bash helpers/release.sh
      - if: steps.freshness.outputs.skip != 'true'
        name: Mint verified release publisher token
        id: publisher
        uses: maxmeis/release-bot/actions/publisher-token@ac8269adb164a9e768bf637169229f9bd0bb4d0e # pinned release-bot commit
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          expected-app-slug: ${{ vars.RELEASE_BOT_APP_SLUG }}
          expected-installation-id: ${{ vars.RELEASE_BOT_INSTALLATION_ID }}
      - name: Publish Canary
        if: steps.freshness.outputs.skip != 'true'
        env:
          CHANNEL: canary
          VERSION: 0.0.0-canary.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_APP: 'true'
          PUBLISH_EXTERNAL_TAP: ${{ vars.PUBLISH_EXTERNAL_TAP || 'false' }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'maxmeis/homebrew-formulae' }}
          PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          TAP_SSH_PRIVATE_KEY: ${{ secrets.TAP_SSH_PRIVATE_KEY }}
        run: make publish
