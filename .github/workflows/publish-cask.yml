name: Publish verified Homebrew metadata
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release-casks/stable, release-casks/canary]
permissions:
  contents: read
concurrency:
  group: hypermug-cask-publication
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: >-
      vars.RELEASE_BOT_ENABLED == 'true' &&
      github.repository == 'maxmeis/hypermug' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'release-casks/stable' ||
       github.event.workflow_run.head_branch == 'release-casks/canary')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # workflow_run is privileged. Execute trusted main code, never the
      # triggering branch's scripts, workflow, artifacts, or shell input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Mint verified release publisher token
        id: publisher
        uses: maxmeis/release-bot/actions/publisher-token@ac8269adb164a9e768bf637169229f9bd0bb4d0e # pinned release-bot commit
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          expected-app-slug: ${{ vars.RELEASE_BOT_APP_SLUG }}
          expected-installation-id: ${{ vars.RELEASE_BOT_INSTALLATION_ID }}
      - name: Verify and fast-forward the release cask
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          PUBLISHER_TOKEN: ${{ steps.publisher.outputs.token }}
          PUBLISHER_REPOSITORY: ${{ steps.publisher.outputs.repository }}
          PUBLISHER_APP_ID: ${{ steps.publisher.outputs.app-id }}
          PUBLISHER_INSTALLATION_ID: ${{ steps.publisher.outputs.installation-id }}
          PUBLISHER_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
          PUBLISHER_BOT_USER_ID: ${{ steps.publisher.outputs.bot-user-id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python3 helpers/finalize_source_cask.py
          --repository "$SOURCE_REPOSITORY"
          --releases-repository "$RELEASES_REPOSITORY"
          --run-id "$CI_RUN_ID"
